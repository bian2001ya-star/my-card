<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>يسرى ياسر</title>
<style>
  :root { --bg:#f3ecf7; --card:#ffffff; --ink:#2b1d3a; --soft:#6b5a7c; --accent:#7a3fb0; --line:#e3d6ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1426; --card:#2a1d38; --ink:#f4eefa; --soft:#c0aed2; --accent:#c9a0ef; --line:#42305a; }
  }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--ink);
         font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:24px;
          border:1px solid var(--line); padding:36px 28px; text-align:center; }
  .avatar { width:96px; height:96px; border-radius:50%; margin:0 auto 16px;
            background:var(--accent); color:#fff; display:grid; place-items:center;
            font-size:44px; font-weight:700; }
  h1 { font-size:1.7rem; }
  .job { color:var(--accent); margin-top:6px; font-weight:600; }
  p.about { color:var(--soft); line-height:1.9; margin:18px 0 24px; }
  ul { list-style:none; padding:0; display:grid; gap:10px; }
  li a { display:block; padding:14px; border-radius:14px; border:1px solid var(--line);
         color:var(--ink); text-decoration:none; font-weight:600; }
  li a:hover, li a:focus-visible { background:var(--accent); color:#fff; outline:none; }
  footer { margin-top:22px; font-size:.85rem; color:var(--soft); }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">ي</div>
    <h1>يسرى ياسر</h1>
    <div class="job">طالبة سنة أولى</div>
    <p class="about">أتعلم بناء المواقع بالذكاء الاصطناعي، وهذه بطاقتي الأولى على الإنترنت. أقدّم أيضًا دروسًا خصوصية.</p>

      <li><a href="https://www.tiktok.com/@user9821166540805?_r=1&_t=ZS-9AuDXnauznM" target="_blank" rel="noopener">تيك توك</a></li>
      <li><a href="https://github.com/bian2001ya-star" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="mailto:yosraalashwal47@gmil.com" target="_blank" rel="noopener">راسلني عبر الإيميل</a></li>
    </ul>
    <footer>صُنعت بمساعدة الذكاء الاصطناعي</footer>
  </main>
</body>
</html>
